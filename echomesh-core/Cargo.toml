[package]
name = "echomesh-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "echomesh_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "test-connect"
path = "src/bin/test-connect.rs"

[features]
default = ["native-ble"]
native-ble = ["dep:btleplug", "dep:ble-peripheral-rust"]

[dependencies]
uniffi = { version = "0.29", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
snow = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "fast"] }
rand = "0.8"
rand_core = "0.6"
hex = "0.4"
bs58 = "0.5"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "fast-rng"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
curve25519-dalek = "4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
btleplug = { version = "0.13", optional = true }
ble-peripheral-rust = { version = "0.2", optional = true }
keyring = { version = "4.2", default-features = false, features = ["v1"] }