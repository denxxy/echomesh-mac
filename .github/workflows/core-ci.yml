name: core-ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: echomesh-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: echomesh-core
      - name: Cargo check
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee cargo-check.log
      - name: Cargo test
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee cargo-test.log
      - name: Upload cargo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostics-${{ matrix.os }}
          path: |
            echomesh-core/cargo-check.log
            echomesh-core/cargo-test.log
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate historical compiled secret
        shell: bash
        run: |
          needle="echomesh_secret_mesh""_token_2026"
          grep -Rl --exclude-dir=.git "$needle" . > secret-files.txt || true
          if [ -s secret-files.txt ]; then
            echo 'compiled secret found'
            exit 1
          fi
      - name: Upload secret scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-files
          path: secret-files.txt
          if-no-files-found: ignore
