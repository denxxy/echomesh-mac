name: Native Adapter CI

on:
  push:
  pull_request:

concurrency:
  group: mac-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core bindings and macOS app
        run: ./build.sh
